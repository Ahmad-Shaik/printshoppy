
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintShoppy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-3 text-center">
        <img src="/mnt/data/printshoppy-logo.svg" alt="PrintShoppy Logo" class="img-fluid" style="max-height: 100px;">
        <p>SINCE 2015</p>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="#">FAQ's</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Track Order</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Login / Register</a></li>
                <li class="nav-item"><a class="nav-link" href="#">🛒</a></li>
            </ul>
        </div>
    </nav>

    <div class="container text-center mt-4">
        <h2 class="text-primary">Turn Your Photos Into Products</h2>
        <div class="input-group mt-3">
            <input type="text" class="form-control" placeholder="Search for Name Pencils, Puzzles etc." aria-label="Search">
            <button class="btn btn-outline-secondary">🔍</button>
        </div>
    </div>

    <div class="container text-center mt-3">
        <div class="row">
            <div class="col"><button class="btn btn-outline-secondary">New In</button></div>
            <div class="col"><button class="btn btn-outline-secondary">Wall Decoratives</button></div>
            <div class="col"><button class="btn btn-outline-secondary">AI Zone</button></div>
            <div class="col"><button class="btn btn-outline-secondary">Desk Decoratives</button></div>
            <div class="col"><button class="btn btn-outline-secondary">Home Decoratives</button></div>
            <div class="col"><button class="btn btn-outline-secondary">Car Decoratives</button></div>
            <div class="col"><button class="btn btn-outline-secondary">Fashion & Accessories</button></div>
        </div>
    </div>

    <div class="container mt-4">
        <h3 class="text-center">POPULAR PRODUCTS</h3>
        <div class="row text-center">
            <div class="col-md-4">
                <div class="border p-3">Product 1</div>
            </div>
            <div class="col-md-4">
                <div class="border p-3">Product 2</div>
            </div>
            <div class="col-md-4">
                <div class="border p-3">Product 3</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
